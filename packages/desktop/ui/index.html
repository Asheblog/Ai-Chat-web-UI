<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>AI Chat</title>
  <link rel="stylesheet" href="./connection.css">
  <script defer src="./connection.js"></script>
</head>
<body>
  <div class="desktop-titlebar" id="desktop-titlebar">
    <div class="titlebar-brand">
      <img class="titlebar-mark" src="../build/icon.svg" alt="" width="22" height="22">
      <span class="titlebar-app-name">AI Chat</span>
      <span class="site-badge" id="site-badge" hidden><span class="site-indicator" aria-hidden="true"></span><span id="site-host"></span></span>
    </div>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <button class="titlebar-more" id="titlebar-more" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" title="更多">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="9" r="1.4"/></svg>
      <span>更多</span>
    </button>
  </div>
  <main>
    <section class="card" aria-labelledby="connect-title" id="setup">
      <header>
        <div class="brand"><img class="mark" src="../build/icon.svg" alt="" width="28" height="28"> AI Chat Desktop</div>
        <h1 id="connect-title">连接到你的服务器</h1>
        <p>输入 AI Chat 站点地址，连接后在站点登录。</p>
      </header>
      <form id="connect-form" novalidate>
        <div class="field">
          <label for="address">服务器地址</label>
          <div class="input-wrap">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14.5 14.5 0 0 1 0 18 14.5 14.5 0 0 1 0-18Z"/></svg>
            <input id="address" type="text" inputmode="url" placeholder="https://chat.example.com" autocomplete="url" spellcheck="false" aria-describedby="address-hint" required>
          </div>
          <p id="address-hint" class="hint">填写站点首页地址，不需要加 /api。</p>
          <p id="address-error" role="alert" class="field-error" hidden></p>
          <p id="checking-hint" role="status" class="checking" hidden>正在检查服务器是否可访问…</p>
        </div>
        <button type="submit" id="connect" class="primary"><span id="spin" aria-hidden="true" hidden></span><span id="connect-label">连接服务器</span><span id="arrow" aria-hidden="true">→</span></button>
      </form>
      <p class="help">还没有服务器？ <button type="button" class="link" id="guide">查看部署指南 <span aria-hidden="true">↗</span></button></p>
    </section>
    <section class="card" aria-labelledby="recovery-title" id="recovery" hidden>
      <header>
        <div class="status-icon" aria-hidden="true">
          <svg id="offline-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8.8a14 14 0 0 1 16-1.9M5.7 12.5a10 10 0 0 1 10-1.9m-6.8 5.1a4.8 4.8 0 0 1 4.3-.1M12 19h.01M3 3l18 18"/></svg>
          <svg id="certificate-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M12 22s7.5-3.9 7.5-10V5L12 2 4.5 5v7c0 6.1 7.5 10 7.5 10Z"/><path d="M12 8v4m0 4h.01"/></svg>
        </div>
        <h1 tabindex="-1" id="recovery-title"></h1>
        <p id="recovery-message"></p>
      </header>
      <div class="field"><span class="label">服务器地址</span><p class="saved-address" id="attempted-address"></p></div>
      <div class="actions">
        <button id="retry" class="primary">重试连接</button>
        <button id="edit" class="secondary">修改地址</button>
      </div>
    </section>
  </main>
</body>
</html>
