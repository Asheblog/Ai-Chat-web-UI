# 生产默认：all-in-one（frontend + backend + rag-worker）+ docker-socket-proxy
# 旧四容器拓扑见 docker-compose.split.yml

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ai-chat-web-ui-docker-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - ai-chat-web-ui-network

  app:
    image: ghcr.io/asheblog/aichat:latest
    container_name: ai-chat-web-ui-app
    depends_on:
      - docker-socket-proxy
    environment:
      - NODE_ENV=production
      - PORT=8001
      - DATABASE_URL=file:/app/data/app.db
      - NODE_OPTIONS=${BACKEND_NODE_OPTIONS:---max-old-space-size=1024}
      - JWT_SECRET=${JWT_SECRET:-replace-with-strong-secret}
      - SECRET_VAULT_MASTER_KEY=${SECRET_VAULT_MASTER_KEY}
      - DEFAULT_CONTEXT_TOKEN_LIMIT=${DEFAULT_CONTEXT_TOKEN_LIMIT:-120000}
      - ENABLE_CORS=${ENABLE_CORS:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_INIT_ON_START=${DB_INIT_ON_START:-false}
      - PYTHON_RUNTIME_RECONCILE_ON_START=${PYTHON_RUNTIME_RECONCILE_ON_START:-true}
      - SKILL_STORAGE_ROOT=/app/data/skills
      - WORKSPACE_TOOL_ENABLE=${WORKSPACE_TOOL_ENABLE:-true}
      - WORKSPACE_ROOT_DIR=${WORKSPACE_ROOT_DIR:-/app/data/workspaces/chat}
      - WORKSPACE_ARTIFACT_TTL_MINUTES=${WORKSPACE_ARTIFACT_TTL_MINUTES:-60}
      - WORKSPACE_IDLE_TTL_MINUTES=${WORKSPACE_IDLE_TTL_MINUTES:-1440}
      - WORKSPACE_CLEANUP_INTERVAL_MINUTES=${WORKSPACE_CLEANUP_INTERVAL_MINUTES:-5}
      - WORKSPACE_MAX_BYTES=${WORKSPACE_MAX_BYTES:-1073741824}
      - WORKSPACE_ARTIFACT_MAX_BYTES=${WORKSPACE_ARTIFACT_MAX_BYTES:-104857600}
      - WORKSPACE_MAX_ARTIFACTS_PER_MESSAGE=${WORKSPACE_MAX_ARTIFACTS_PER_MESSAGE:-20}
      - WORKSPACE_RUN_TIMEOUT_MS=${WORKSPACE_RUN_TIMEOUT_MS:-120000}
      - WORKSPACE_MAX_CONCURRENT_RUNS=${WORKSPACE_MAX_CONCURRENT_RUNS:-2}
      - WORKSPACE_RUN_QUEUE_TIMEOUT_MS=${WORKSPACE_RUN_QUEUE_TIMEOUT_MS:-15000}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - WORKSPACE_DOCKER_IMAGE=${WORKSPACE_DOCKER_IMAGE:-python:3.11-slim}
      - WORKSPACE_DOCKER_CPUS=${WORKSPACE_DOCKER_CPUS:-0.5}
      - WORKSPACE_DOCKER_MEMORY=${WORKSPACE_DOCKER_MEMORY:-512m}
      - WORKSPACE_DOCKER_PIDS_LIMIT=${WORKSPACE_DOCKER_PIDS_LIMIT:-128}
      - WORKSPACE_ARTIFACT_SIGNING_SECRET=${WORKSPACE_ARTIFACT_SIGNING_SECRET:-replace-with-strong-secret}
      - WORKSPACE_LIST_MAX_ENTRIES=${WORKSPACE_LIST_MAX_ENTRIES:-500}
      - WORKSPACE_READ_MAX_CHARS=${WORKSPACE_READ_MAX_CHARS:-120000}
      - WORKSPACE_GIT_CLONE_TIMEOUT_MS=${WORKSPACE_GIT_CLONE_TIMEOUT_MS:-120000}
      - WORKSPACE_PYTHON_INSTALL_TIMEOUT_MS=${WORKSPACE_PYTHON_INSTALL_TIMEOUT_MS:-600000}
      - URL_READER_TIMEOUT=${URL_READER_TIMEOUT:-30000}
      - URL_READER_MAX_CONTENT_LENGTH=${URL_READER_MAX_CONTENT_LENGTH:-100000}
      - URL_READER_MAX_BODY_BYTES=${URL_READER_MAX_BODY_BYTES:-8388608}
      - URL_READER_BROWSER_ENABLE=${URL_READER_BROWSER_ENABLE:-true}
      - URL_READER_BROWSER_EXECUTABLE_PATH=${URL_READER_BROWSER_EXECUTABLE_PATH:-}
      - URL_READER_RENDER_WAIT_MS=${URL_READER_RENDER_WAIT_MS:-1200}
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_HOST=127.0.0.1
      - BACKEND_INTERNAL_PORT=8001
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      - backend_images:/app/storage/chat-images
    ports:
      # 对外只暴露前端；浏览器经 Next rewrites 访问 /api
      - "${FRONTEND_PORT:-3000}:3000"
      # 可选：直接暴露后端（调试用）。1Panel/Nginx 通常只反代 FRONTEND_PORT
      # - "${BACKEND_PORT:-8001}:8001"
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/api/health >/dev/null && curl -fsS http://localhost:8001/api/settings/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      ai-chat-web-ui-network:
        aliases:
          - backend
          - frontend

volumes:
  backend_data:
    driver: local
    name: ai_chat_web_ui_db_data
  backend_logs:
    driver: local
    name: ai_chat_web_ui_logs
  backend_images:
    driver: local
    name: ai_chat_web_ui_images

networks:
  ai-chat-web-ui-network:
    driver: bridge
    name: ai_chat_web_ui_network
