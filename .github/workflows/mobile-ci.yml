name: Mobile CI

on:
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/mobile-release.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/mobile-release.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile typecheck & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aichat/shared build

      - name: Type-check mobile
        run: pnpm --filter @aichat/mobile type-check

      - name: Run mobile unit tests
        run: pnpm --filter @aichat/mobile test

      - name: Validate Expo config
        run: pnpm --filter @aichat/mobile exec expo config --type public >/dev/null

      - name: Read mobile version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const a = require('./packages/mobile/app.json'); const p = require('./packages/mobile/package.json'); if (a.expo.version !== p.version) throw new Error('version mismatch'); console.log(a.expo.version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android-apk:
    name: Android APK (Free self-signed)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aichat/shared build

      - name: Build installable Android APK
        run: pnpm --filter @aichat/mobile android:build-apk

      - name: Prepare Android artifact
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages/mobile/dist
          out="packages/mobile/dist/aichat-mobile-${VERSION}-android.apk"
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "$out"
          ( cd packages/mobile/dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aichat-mobile-android-apk
          retention-days: 14
          path: |
            packages/mobile/dist/*-android.apk
            packages/mobile/dist/*-android.apk.sha256
          if-no-files-found: error

  ios-ipa:
    name: iOS Unsigned IPA
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aichat/shared build

      - name: Build unsigned iOS IPA
        run: bash packages/mobile/scripts/build-ios-unsigned-ipa.sh

      - name: Upload iOS unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aichat-mobile-ios-unsigned-ipa
          retention-days: 14
          path: |
            packages/mobile/dist/*-ios-unsigned.ipa
            packages/mobile/dist/*-ios-unsigned.ipa.sha256
          if-no-files-found: error
