name: Desktop CI

# 桌面端测试安装包：Windows x64 (NSIS) + macOS Apple Silicon (DMG)。
# 只产出未签名测试包，不读取任何签名 Secrets，也不创建 GitHub Release。
on:
  pull_request:
    paths:
      - "packages/desktop/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS)
            os: windows-2022
            build_command: pnpm --filter @aichat/desktop dist:win
            artifact: aichat-desktop-windows-x64
            extension: exe
          - name: macOS Apple Silicon (DMG)
            os: macos-15
            build_command: pnpm --filter @aichat/desktop dist:mac
            artifact: aichat-desktop-macos-arm64
            extension: dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop tests
        run: pnpm --filter @aichat/desktop test

      - name: Build unsigned test installer
        env:
          # 测试包不签名：显式关闭钥匙串证书自动发现，避免 runner 上残留证书干扰。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.build_command }}

      - name: Verify installer artifact
        shell: bash
        env:
          EXT: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          files="$(find packages/desktop/dist -maxdepth 1 -type f -name "*.${EXT}" -print 2>/dev/null || true)"
          count="$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one *.${EXT} in packages/desktop/dist, found ${count}"
            ls -la packages/desktop/dist || true
            exit 1
          fi
          file="$(printf '%s\n' "$files" | sed '/^$/d')"
          size="$(wc -c < "$file" | tr -d ' ')"
          if [ "$size" -lt 1048576 ]; then
            echo "::error::installer looks too small (${size} bytes): $file"
            exit 1
          fi
          echo "installer: $file (${size} bytes)"

      - name: Verify Windows x64 payload
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path "packages/desktop/dist/win-unpacked" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $app) {
            throw "no packaged *.exe found under packages/desktop/dist/win-unpacked"
          }
          $stream = [System.IO.File]::OpenRead($app.FullName)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $stream.Dispose()
          }
          if ($machine -ne 0x8664) {
            throw ("expected x64 PE machine 0x8664, got 0x{0:X4}" -f $machine)
          }
          Write-Host "x64 payload ok: $($app.FullName)"

      - name: Verify Apple Silicon architecture
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find packages/desktop/dist -maxdepth 2 -type d -name '*.app' -print | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "::error::no .app bundle found in packages/desktop/dist"
            exit 1
          fi
          exec_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          archs="$(lipo -archs "$app_path/Contents/MacOS/$exec_name")"
          echo "architectures: $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *)
              echo "::error::expected arm64 application payload, got: $archs"
              exit 1
              ;;
          esac
          dmg="$(find packages/desktop/dist -maxdepth 1 -type f -name '*.dmg' -print | head -n 1)"
          hdiutil verify "$dmg"

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/desktop/dist/*.${{ matrix.extension }}
          if-no-files-found: error
