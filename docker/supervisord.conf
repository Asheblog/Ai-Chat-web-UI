[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
command=/usr/local/bin/run-as-backend.sh node dist/index.js
directory=/app/packages/backend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:rag-worker]
command=/usr/local/bin/run-as-backend.sh node dist/workers/document-worker.js
directory=/app/packages/backend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:frontend]
command=/usr/local/bin/run-as-frontend.sh node packages/frontend/server.js
directory=/opt/frontend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",NEXT_PUBLIC_API_URL="/api",BACKEND_HOST="127.0.0.1",BACKEND_INTERNAL_PORT="8001",NEXT_TELEMETRY_DISABLED="1"
